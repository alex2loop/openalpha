# The web edition: static assets only, no Worker script, no logs kept on the operator's side.
# Build first: bun run build:web --app-url=<web app address> (add --noindex for staging).
name = "openalpha-web-staging"
compatibility_date = "2026-11-03"

# Staging answers on workers.dev. For the real domain: drop the next two lines, rename the Worker,
# and add `routes = [{ pattern = "app.<domain>", custom_domain = true }]`.
workers_dev = true
preview_urls = false

[assets]
directory = "../../dist/web"

[observability]
enabled = false

# Production: deployed with `--env production`. No workers.dev address and no route yet, so the Worker
# exists (a deploy token can be scoped to it) but nobody can reach it until the domain is attached:
# add `routes = [{ pattern = "app.<domain>", custom_domain = true }]` here and build without --noindex.
[env.production]
name = "openalpha-web"
workers_dev = false
preview_urls = false

[env.production.assets]
directory = "../../dist/web"

[env.production.observability]
enabled = false
