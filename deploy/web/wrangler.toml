# The web edition: static assets only, no Worker script, no logs kept on the operator's side.
# Build first: bun run build:web --app-url=<web app address> (add --noindex for staging).
name = "openalpha-web-staging"
compatibility_date = "2026-11-03"

# Staging answers on workers.dev; production answers on its own domain (below).
workers_dev = true
preview_urls = false

[assets]
directory = "../../dist/web"

[observability]
enabled = false

# Production: deployed with `--env production`, built without --noindex, on the domain alone.
[env.production]
name = "openalpha-web"
workers_dev = false
preview_urls = false
routes = [{ pattern = "web.openalpha.link", custom_domain = true }]

[env.production.assets]
directory = "../../dist/web"

[env.production.observability]
enabled = false
