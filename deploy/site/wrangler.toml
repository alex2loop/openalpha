# The homepage: the static `site/` folder, no Worker script, no logs kept on the operator's side.
# Build first: bun run build:site --app-url=<web app address> (add --noindex for staging).
name = "openalpha-site-staging"
compatibility_date = "2026-11-03"

# Staging answers on workers.dev. For the real domain: drop the next two lines, rename the Worker,
# and add `routes = [{ pattern = "<domain>", custom_domain = true }, { pattern = "www.<domain>", custom_domain = true }]`.
workers_dev = true
preview_urls = false

[assets]
directory = "../../dist/site"

[observability]
enabled = false

# Production: deployed with `--env production`. No workers.dev address and no route yet, so the Worker
# exists (a deploy token can be scoped to it) but nobody can reach it until the domain is attached:
# add `routes = [{ pattern = "<domain>", custom_domain = true }, { pattern = "www.<domain>", custom_domain = true }]`
# here and build without --noindex.
[env.production]
name = "openalpha-site"
workers_dev = false
preview_urls = false

[env.production.assets]
directory = "../../dist/site"

[env.production.observability]
enabled = false
