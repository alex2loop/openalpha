name: release

# A push that sets a new package.json version publishes it: the gates run, the binaries are built
# and checked, each is started on a machine of its kind, and only then are the tag and the GitHub
# Release created with them attached, the MCP launcher published to npm and the release listed on
# the MCP Registry. Run it by hand to retry a release whose gates failed, or with dry_run to
# rehearse every step but the publish.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and start-test the binaries, but create no tag, no Release, no npm package and no registry listing.
        type: boolean
        default: false

# Declared per job instead of here: only the publish job writes, and it needs `contents: write`
# for the tag and the Release.
permissions:
  contents: read

# Never cancelled: a half-finished release would leave a tag without its Release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # macOS: a darwin binary must be re-signed after Bun appends the bundle, and only codesign does
    # that. Bun cross-compiles the other binaries from here.
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      new: ${{ steps.version.outputs.new }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A dry run builds even a version already released, so the workflow itself can be rehearsed.
      - name: Read version
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(jq -r .version package.json)"
          new=true
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            new=false
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" = true ] || [ "$DRY_RUN" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.build == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - if: steps.version.outputs.build == 'true'
        run: bun install --frozen-lockfile

      - if: steps.version.outputs.build == 'true'
        run: bun run check

      - if: steps.version.outputs.build == 'true'
        run: bun run lint:arch

      # Built on the Bun the gates just ran on, so a user runs exactly that build. The x64 darwin
      # binary keeps Bun's own signature, which the appended bundle invalidates, so both are
      # re-signed ad hoc, as a native compile already is.
      - name: Build binaries
        if: steps.version.outputs.build == 'true'
        run: |
          bun run build:all
          for binary in dist/openalpha-darwin-*; do
            codesign --remove-signature "$binary"
            codesign --force --sign - "$binary"
          done
          cd dist
          shasum -a 256 openalpha-* > SHA256SUMS

      # The MCP bundle and the npm package carry no binary: their launcher starts the one the user
      # installed, so one build serves every platform. server.json names both for the registry.
      - name: Build the MCP bundle
        if: steps.version.outputs.build == 'true'
        run: bun run build:mcp-bundle

      - name: Extract release notes
        if: steps.version.outputs.build == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $TAG"
            exit 1
          fi

      # An immutable Release can never gain a missing file, so the set is checked before anything is
      # published: exactly the binaries `build:all` names, none empty, each with its checksum line,
      # plus one MCP bundle whose hash server.json states and the npm launcher at this version.
      - name: Check the release files
        if: steps.version.outputs.build == 'true'
        run: |
          expected="$(jq -r '.scripts["build:all"]' package.json | grep -oE 'dist/openalpha-[^ ]+' | sort)"
          built="$(ls dist/openalpha-* | sort)"
          if [ "$expected" != "$built" ]; then
            echo "Built binaries differ from build:all:"
            diff <(echo "$expected") <(echo "$built") || true
            exit 1
          fi
          for binary in $expected; do
            name="${binary#dist/}"
            [ -s "$binary" ] || { echo "$name is empty"; exit 1; }
            awk -v n="$name" '$2 == n { found = 1 } END { exit !found }' dist/SHA256SUMS \
              || { echo "$name has no line in SHA256SUMS"; exit 1; }
          done
          shopt -s nullglob
          bundles=(dist/*.mcpb)
          shopt -u nullglob
          if [ "${#bundles[@]}" -ne 1 ] || [ ! -s "${bundles[0]}" ]; then
            echo "Expected one non-empty MCP bundle, found: ${bundles[*]:-none}"
            exit 1
          fi
          [ -s dist/server.json ] || { echo "dist/server.json is missing"; exit 1; }
          if [ "$(jq -r '.packages[0].fileSha256' dist/server.json)" != "$(shasum -a 256 "${bundles[0]}" | cut -d' ' -f1)" ]; then
            echo "dist/server.json does not state the hash of ${bundles[0]}"
            exit 1
          fi
          [ -s dist/npm/launch.cjs ] || { echo "dist/npm/launch.cjs is missing"; exit 1; }
          if [ "$(jq -r .version dist/npm/package.json)" != "$(jq -r .version package.json)" ]; then
            echo "dist/npm/package.json is not at this release's version"
            exit 1
          fi

      - if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/openalpha-*
            dist/SHA256SUMS
            dist/*.mcpb
            notes.md
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 1

      # The npm and registry jobs may be re-run days after the release, past release-files' one-day
      # life, so their small inputs are kept apart and kept longer.
      - if: steps.version.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry-files
          path: |
            dist/server.json
            dist/npm/
          if-no-files-found: error
          retention-days: 30

  # Each binary a machine of its kind can run is started the way an operator starts it, from the
  # very file that will be published. darwin-x64 has no free hosted runner and is checked by its
  # checksum only.
  start-test:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, asset: openalpha-darwin-arm64 }
          - { runner: ubuntu-latest, asset: openalpha-linux-x64 }
          - { runner: ubuntu-24.04-arm, asset: openalpha-linux-arm64 }
          - { runner: windows-latest, asset: openalpha-windows-x64.exe }
          - { runner: windows-11-arm, asset: openalpha-windows-arm64.exe }
          - { runner: windows-11-arm, asset: openalpha-windows-x64.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      - name: Check the checksum
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          $line = Get-Content dist/SHA256SUMS | Where-Object { ($_ -split '\s+')[1] -eq $env:ASSET }
          $expected = if ($line) { ($line -split '\s+')[0] } else { '' }
          $actual = (Get-FileHash -Algorithm SHA256 "dist/$env:ASSET").Hash.ToLowerInvariant()
          if ($actual -ne $expected) { "dist/$env:ASSET does not match SHA256SUMS"; exit 1 }

      - uses: ./.github/actions/daemon-lifecycle
        with:
          binary: dist/${{ matrix.asset }}

  # Only main publishes: a manual run on another branch rehearses at most.
  publish:
    needs: [build, start-test]
    if: needs.build.outputs.new == 'true' && !inputs.dry_run && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The tag and the Release are the only writes this workflow makes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files

      # A prerelease is marked as one, so releases/latest (what installs and update checks read)
      # keeps pointing at the last full release.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md $prerelease \
            dist/openalpha-* dist/SHA256SUMS dist/*.mcpb CHANGELOG.md

  # Publishes the npm launcher the registry lists for apps that install with npx. npm takes it by
  # trusted publishing (OIDC, no token), set up on npmjs.com after the package's first hand-made
  # publish. A version npm already holds is skipped, so a re-run carries on to the registry.
  npm:
    needs: [build, publish]
    if: needs.build.outputs.new == 'true' && !inputs.dry_run && github.ref == 'refs/heads/main' && !contains(needs.build.outputs.tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-files
          path: dist

      # Node 24 ships the npm 11 trusted publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Publish the npm launcher
        working-directory: dist/npm
        run: |
          spec="$(jq -r '.name + "@" + .version' package.json)"
          if npm view "$spec" version > /dev/null 2>&1; then
            echo "$spec is already on npm"
            exit 0
          fi
          npm publish --provenance --access public

  # Lists the release on the MCP Registry, which directories such as Glama mirror. It runs after the
  # Release exists, so a registry failure leaves the Release intact and "Re-run failed jobs" retries
  # only this job while registry-files lasts. A prerelease is not listed, as releases/latest skips
  # it too.
  registry:
    needs: [build, publish, npm]
    if: needs.build.outputs.new == 'true' && !inputs.dry_run && github.ref == 'refs/heads/main' && !contains(needs.build.outputs.tag, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The OIDC token is the login the registry accepts for this repository's io.github namespace.
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-files
          path: dist

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # The publisher runs only after its signature from the registry's own release workflow checks.
      - name: Download mcp-publisher
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        working-directory: dist
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
